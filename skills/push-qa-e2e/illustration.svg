<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <!-- Background -->
  <rect width="960" height="540" fill="#f8fafc"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="960" height="56" fill="#0f172a"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#f8fafc">Push QA end-to-end</text>
  <text x="210" y="36" font-size="14" fill="#cbd5e1">send → deliver → show → tap → verify, with screen recording as evidence</text>

  <!-- Recording bar (spans all stages) -->
  <g transform="translate(40, 80)">
    <rect width="880" height="36" rx="6" fill="#0f172a"/>
    <circle cx="20" cy="18" r="7" fill="#dc2626"/>
    <circle cx="20" cy="18" r="3" fill="#ffffff"/>
    <text x="36" y="22" font-size="11" fill="#ffffff" font-weight="600">adb screenrecord (MP4, ≤180 s, no audio)</text>
    <text x="240" y="22" font-size="11" fill="#cbd5e1">start</text>
    <line x1="280" y1="18" x2="780" y2="18" stroke="#475569" stroke-width="1.5"/>
    <text x="800" y="22" font-size="11" fill="#cbd5e1">stop → push-qa.mp4</text>
  </g>

  <!-- 5-stage pipeline -->
  <!-- Stage 1: Agent -->
  <g transform="translate(40, 150)">
    <rect width="160" height="160" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect width="160" height="28" rx="10" fill="#1e40af"/>
    <rect y="18" width="160" height="10" fill="#1e40af"/>
    <text x="80" y="19" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1. AGENT</text>
    <text x="80" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">pushlab_cli.py</text>
    <text x="14" y="82" font-size="10" fill="#475569" font-family="ui-monospace, monospace">push-check</text>
    <text x="14" y="98" font-size="10" fill="#475569" font-family="ui-monospace, monospace">--title "QA ping"</text>
    <text x="14" y="114" font-size="10" fill="#475569" font-family="ui-monospace, monospace">--tap</text>
    <text x="14" y="130" font-size="10" fill="#475569" font-family="ui-monospace, monospace">--timeout 45</text>
    <text x="80" y="148" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">SEND</text>
  </g>

  <!-- Stage 2: Beacon -->
  <g transform="translate(220, 150)">
    <rect width="160" height="160" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect width="160" height="28" rx="10" fill="#0891b2"/>
    <rect y="18" width="160" height="10" fill="#0891b2"/>
    <text x="80" y="19" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2. BEACON</text>
    <text x="80" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">push service</text>
    <g transform="translate(14, 76)" font-size="9" fill="#475569">
      <rect width="60" height="16" rx="3" fill="#ecfeff" stroke="#0891b2"/>
      <text x="30" y="11" text-anchor="middle" fill="#0e7490">webpush</text>
      <rect x="64" y="0" width="60" height="16" rx="3" fill="#ecfeff" stroke="#0891b2"/>
      <text x="94" y="11" text-anchor="middle" fill="#0e7490">fcm</text>
      <rect x="0" y="20" width="60" height="16" rx="3" fill="#ecfeff" stroke="#0891b2"/>
      <text x="30" y="31" text-anchor="middle" fill="#0e7490">ntfy</text>
      <rect x="64" y="20" width="60" height="16" rx="3" fill="#ecfeff" stroke="#0891b2"/>
      <text x="94" y="31" text-anchor="middle" fill="#0e7490">apprise</text>
    </g>
    <text x="80" y="148" text-anchor="middle" font-size="10" font-weight="600" fill="#0891b2">DELIVER</text>
  </g>

  <!-- Stage 3: Push Service -->
  <g transform="translate(400, 150)">
    <rect width="160" height="160" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect width="160" height="28" rx="10" fill="#a855f7"/>
    <rect y="18" width="160" height="10" fill="#a855f7"/>
    <text x="80" y="19" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3. PUSH SERVICE</text>
    <text x="80" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Apple / Google / MSFT</text>
    <g transform="translate(14, 76)" font-size="10" fill="#475569">
      <rect width="132" height="20" rx="3" fill="#faf5ff" stroke="#a855f7"/>
      <text x="66" y="13" text-anchor="middle" fill="#6b21a8">Apple APNs</text>
      <rect y="24" width="132" height="20" rx="3" fill="#faf5ff" stroke="#a855f7"/>
      <text x="66" y="37" text-anchor="middle" fill="#6b21a8">Google FCM</text>
      <rect y="48" width="132" height="20" rx="3" fill="#faf5ff" stroke="#a855f7"/>
      <text x="66" y="61" text-anchor="middle" fill="#6b21a8">MSFT WNS</text>
    </g>
    <text x="80" y="148" text-anchor="middle" font-size="10" font-weight="600" fill="#a855f7">SHOW</text>
  </g>

  <!-- Stage 4: Phone (with notification shade mock) -->
  <g transform="translate(580, 130)">
    <rect width="160" height="200" rx="20" fill="#0f172a"/>
    <rect x="8" y="36" width="144" height="156" rx="6" fill="#f8fafc"/>
    <rect x="8" y="36" width="144" height="14" fill="#e2e8f0"/>
    <text x="80" y="46" text-anchor="middle" font-size="9" fill="#475569">9:41</text>
    <rect x="60" y="6" width="40" height="6" rx="3" fill="#475569"/>
    <!-- Notification shade pulled down -->
    <rect x="8" y="50" width="144" height="142" rx="4" fill="#e2e8f0" opacity="0.6"/>
    <rect x="14" y="58" width="132" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="20" y="72" font-size="8" fill="#64748b">Beacon</text>
    <text x="20" y="84" font-size="10" font-weight="600" fill="#0f172a">QA ping 1234</text>
    <text x="20" y="94" font-size="9" fill="#475569">hello</text>
    <text x="20" y="138" text-anchor="middle" font-size="10" font-weight="600" fill="#16a34a">TAP →</text>
    <rect x="60" y="198" width="40" height="3" rx="1.5" fill="#94a3b8"/>
  </g>
  <text x="660" y="350" text-anchor="middle" font-size="10" font-weight="600" fill="#16a34a">TAP</text>
  <text x="660" y="362" text-anchor="middle" font-size="9" fill="#64748b">opens the URL sent with --url</text>

  <!-- Stage 5: Tether -->
  <g transform="translate(760, 150)">
    <rect width="160" height="160" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect width="160" height="28" rx="10" fill="#0891b2"/>
    <rect y="18" width="160" height="10" fill="#0891b2"/>
    <text x="80" y="19" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5. TETHER</text>
    <text x="80" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">device QA</text>
    <text x="14" y="82" font-size="10" fill="#475569" font-family="ui-monospace, monospace">ui / screenshot</text>
    <text x="14" y="98" font-size="10" fill="#475569" font-family="ui-monospace, monospace">apps (foreground)</text>
    <text x="14" y="114" font-size="10" fill="#475569" font-family="ui-monospace, monospace">logcat --package</text>
    <text x="14" y="130" font-size="10" fill="#475569" font-family="ui-monospace, monospace">flow &lt;name&gt;.yaml</text>
    <text x="80" y="148" text-anchor="middle" font-size="10" font-weight="600" fill="#0891b2">VERIFY</text>
  </g>

  <!-- Inter-stage arrows -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M 200 230 L 220 230" marker-end="url(#eArrow)"/>
    <path d="M 380 230 L 400 230" marker-end="url(#eArrow)"/>
    <path d="M 560 230 L 580 230" marker-end="url(#eArrow)"/>
    <path d="M 740 230 L 760 230" marker-end="url(#eArrow)"/>
  </g>

  <!-- Tap arc (from phone down/right back up to tether) -->
  <g stroke="#16a34a" stroke-width="2" fill="none" stroke-dasharray="4 3">
    <path d="M 740 250 Q 750 270 740 270" marker-end="url(#tapArrow)"/>
  </g>

  <!-- Bottom timeline (pass/fail) -->
  <g transform="translate(40, 380)" font-size="11" fill="#0f172a">
    <text x="0" y="0" font-weight="700" fill="#0f172a">PASS / FAIL TIMELINE</text>
    <g transform="translate(0, 16)">
      <rect width="160" height="38" rx="6" fill="#dcfce7" stroke="#16a34a"/>
      <circle cx="14" cy="19" r="6" fill="#16a34a"/>
      <path d="M 11 19 L 13 21 L 17 17" stroke="#ffffff" stroke-width="1.5" fill="none"/>
      <text x="28" y="17" font-weight="600">sent</text>
      <text x="28" y="31" fill="#475569">Beacon accepted</text>
    </g>
    <g transform="translate(180, 16)">
      <rect width="160" height="38" rx="6" fill="#dcfce7" stroke="#16a34a"/>
      <circle cx="14" cy="19" r="6" fill="#16a34a"/>
      <path d="M 11 19 L 13 21 L 17 17" stroke="#ffffff" stroke-width="1.5" fill="none"/>
      <text x="28" y="17" font-weight="600">delivered</text>
      <text x="28" y="31" fill="#475569">push service OK</text>
    </g>
    <g transform="translate(360, 16)">
      <rect width="160" height="38" rx="6" fill="#dcfce7" stroke="#16a34a"/>
      <circle cx="14" cy="19" r="6" fill="#16a34a"/>
      <path d="M 11 19 L 13 21 L 17 17" stroke="#ffffff" stroke-width="1.5" fill="none"/>
      <text x="28" y="17" font-weight="600">shown</text>
      <text x="28" y="31" fill="#475569">notification in shade</text>
    </g>
    <g transform="translate(540, 16)">
      <rect width="160" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
      <circle cx="14" cy="19" r="6" fill="#f59e0b"/>
      <text x="11" y="22" text-anchor="middle" font-size="8" fill="#ffffff" font-weight="700">?</text>
      <text x="28" y="17" font-weight="600">opened</text>
      <text x="28" y="31" fill="#475569">right page / activity</text>
    </g>
    <g transform="translate(720, 16)">
      <rect width="160" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
      <circle cx="14" cy="19" r="6" fill="#f59e0b"/>
      <text x="11" y="22" text-anchor="middle" font-size="8" fill="#ffffff" font-weight="700">?</text>
      <text x="28" y="17" font-weight="600">latency</text>
      <text x="28" y="31" fill="#475569">seconds (recorded)</text>
    </g>
  </g>

  <!-- Bottom callouts -->
  <g transform="translate(40, 460)" font-size="10">
    <rect width="880" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="12" y="20" font-weight="700" fill="#78350f">TYPICAL FAILURES</text>
    <text x="12" y="38" font-size="10" fill="#0f172a">sent but never shown → browser subscription expired, Chrome notifications blocked, DND on</text>
    <text x="12" y="52" font-size="10" fill="#0f172a">targeted == 0 → phone subscribed under a different tag (default tag is qa:device) • tap opens wrong page → wrong --url</text>
  </g>

  <defs>
    <marker id="eArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="tapArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
